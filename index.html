<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baranda Choo 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(14, 18, 24, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 12px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .turn-chip {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    .scores {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .controls-card {
      align-self: center;
      display: flex;
      gap: 12px;
      background: rgba(14, 18, 24, 0.9);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s, background 0.15s;
    }
    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(14, 18, 24, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      color: #fff;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
    }
    #tip-banner {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="hud-card">
      <div class="turn-chip" id="turn-indicator">
        <span class="color-dot" id="turn-dot" style="background:#34d399; color:#34d399;"></span>
        <span id="turn-text">LIGHT TURN</span>
      </div>
      <div class="scores">
        <div>🌿 Light: <span id="p1-score">12</span></div>
        <div>🌋 Dark: <span id="p2-score">12</span></div>
      </div>
    </div>

    <div id="tip-banner">Glow = Moveable Unit</div>

    <div class="controls-card">
      <button id="btn-mode">Mode: vs Computer</button>
      <button id="btn-restart">Reset Match</button>
    </div>
  </div>

  <div id="game-over-modal">
    <h2 id="modal-title">Victory!</h2>
    <p id="modal-desc">Light side captured all pieces.</p>
    <button id="modal-btn-restart" style="background:#34d399; color:#080c10; font-weight:700;">Play Again</button>
  </div>

  <script>
    /* =========================================================================
       1. TOPOLOGY & BOARD ENGINE
       ========================================================================= */
    const NODE_COUNT = 25;
    const SPACING = 2.6;

    // Mountain Canyon elevation profile matching reference art
    const ELEVATIONS = [
      0.0, 0.5, 1.6, 0.5, 0.0,
      0.3, 1.0, 0.6, 1.0, 0.3,
      0.0, 0.6, 1.8, 0.6, 0.0, // Node 12: Mountain Altar Summit
      0.3, 1.0, 0.6, 1.0, 0.3,
      0.0, 0.5, 0.9, 0.5, 0.0
    ];

    const Adjacency = Array.from({ length: NODE_COUNT }, () => []);
    const JumpTable = Array.from({ length: NODE_COUNT }, () => []);

    const drOrth = [-1, 1, 0, 0], dcOrth = [0, 0, -1, 1];
    const drDiag = [-1, -1, 1, 1], dcDiag = [-1, 1, -1, 1];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const from = r * 5 + c;
        const hasDiag = ((r + c) % 2 === 0);

        for (let d = 0; d < 4; d++) {
          const nr = r + drOrth[d], nc = c + dcOrth[d];
          if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
            Adjacency[from].push(nr * 5 + nc);
            const jnr = r + 2 * drOrth[d], jnc = c + 2 * dcOrth[d];
            if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
              JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
            }
          }
        }

        if (hasDiag) {
          for (let d = 0; d < 4; d++) {
            const nr = r + drDiag[d], nc = c + dcDiag[d];
            if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
              Adjacency[from].push(nr * 5 + nc);
              const jnr = r + 2 * drDiag[d], jnc = c + 2 * dcDiag[d];
              if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
                JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
              }
            }
          }
        }
      }
    }

    class Engine {
      constructor() {
        this.board = new Uint8Array(NODE_COUNT);
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
        this.reset();
      }

      reset() {
        for (let i = 0; i < 12; i++) this.board[i] = 1;
        this.board[12] = 0;
        for (let i = 13; i < 25; i++) this.board[i] = 2;
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
      }

      getLegalMoves(player) {
        const opponent = player === 1 ? 2 : 1;
        const captures = [];
        const steps = [];

        for (let i = 0; i < NODE_COUNT; i++) {
          if (this.board[i] !== player) continue;
          this.findJumpsRecursive(i, i, [i], new Set(), captures, opponent);

          for (const target of Adjacency[i]) {
            if (this.board[target] === 0) {
              steps.push({ from: i, to: target, path: [i, target], captures: [] });
            }
          }
        }
        return captures.length > 0 ? captures : steps;
      }

      findJumpsRecursive(origin, current, path, capturedSet, results, opponent) {
        let branched = false;
        for (const jump of JumpTable[current]) {
          if (this.board[jump.over] === opponent && !capturedSet.has(jump.over)) {
            if (this.board[jump.to] === 0 || jump.to === origin) {
              branched = true;
              capturedSet.add(jump.over);
              path.push(jump.to);
              this.findJumpsRecursive(origin, jump.to, path, capturedSet, results, opponent);
              path.pop();
              capturedSet.delete(jump.over);
            }
          }
        }
        if (!branched && capturedSet.size > 0) {
          results.push({
            from: origin,
            to: current,
            path: [...path],
            captures: Array.from(capturedSet)
          });
        }
      }

      applyMove(move) {
        this.board[move.to] = this.board[move.from];
        this.board[move.from] = 0;
        for (const cap of move.captures) {
          this.board[cap] = 0;
          if (this.currentTurn === 1) this.p2Count--;
          else this.p1Count--;
        }
        this.currentTurn = this.currentTurn === 1 ? 2 : 1;
      }

      checkResult() {
        if (this.p1Count === 0) return 2;
        if (this.p2Count === 0) return 1;
        if (this.getLegalMoves(this.currentTurn).length === 0) return this.currentTurn === 1 ? 2 : 1;
        return 0;
      }
    }

    /* =========================================================================
       2. THREE.JS SCENE SETUP & LIGHTING
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f16);
    scene.fog = new THREE.FogExp2(0x0a0f16, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    function handleCameraAspect() {
      if (window.innerWidth < window.innerHeight) {
        camera.fov = 58;
        camera.position.set(0, 20, 20);
      } else {
        camera.fov = 45;
        camera.position.set(0, 16, 18);
      }
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    handleCameraAspect();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 8;
    controls.maxDistance = 32;
    controls.target.set(0, 0.8, 0);

    // Environmental Lighting
    scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(12, 26, 14);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    /* =========================================================================
       3. CANYON BOARD & PROCEDURAL VIADUCTS
       ========================================================================= */
    // Materials
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
    const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.95 });

    // Outer Chasm Base & Carved Perimeter Retaining Walls
    const wallGeo = new THREE.BoxGeometry(14.5, 1.8, 14.5);
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.y = -0.9;
    wallMesh.receiveShadow = true;
    scene.add(wallMesh);

    // Decorative Stone Rim Border
    const rimGeo = new THREE.BoxGeometry(15.2, 0.25, 15.2);
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.position.y = -0.05;
    scene.add(rimMesh);

    const nodePositions = [];
    const nodeMeshes = [];
    const pieceMeshes = new Map();
    const highlightRings = [];
    const haloLights = [];

    // Build 25 Octagonal Sockets
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const i = r * 5 + c;
        const pos = new THREE.Vector3((c - 2) * SPACING, ELEVATIONS[i], (r - 2) * SPACING);
        nodePositions.push(pos);

        // Octagonal platform (8-sided cylinder)
        const socket = new THREE.Mesh(
          new THREE.CylinderGeometry(0.85, 0.92, 0.25, 8),
          stoneMat
        );
        socket.position.copy(pos);
        socket.receiveShadow = true;
        socket.userData = { nodeIndex: i };
        scene.add(socket);
        nodeMeshes.push(socket);

        // Platform pillar extending down into chasm
        const pillarHeight = pos.y + 1.8;
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.55, 0.65, pillarHeight, 8),
          bridgeMat
        );
        pillar.position.set(pos.x, pos.y - (pillarHeight / 2), pos.z);
        pillar.receiveShadow = true;
        scene.add(pillar);
      }
    }

    // Build Arched Viaduct Bridges
    const drawnLines = new Set();
    for (let i = 0; i < NODE_COUNT; i++) {
      for (const adj of Adjacency[i]) {
        const min = Math.min(i, adj), max = Math.max(i, adj);
        if (!drawnLines.has(`${min}-${max}`)) {
          drawnLines.add(`${min}-${max}`);
          const pA = nodePositions[min], pB = nodePositions[max];
          const dist = pA.distanceTo(pB);

          // Upper bridge span
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.16, dist), bridgeMat);
          bridge.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
          bridge.position.y -= 0.05;
          bridge.lookAt(pB);
          bridge.receiveShadow = true;
          scene.add(bridge);
        }
      }
    }

    /* =========================================================================
       4. PROCEDURAL FANTASY FACTION PIECES
       ========================================================================= */
    // Materials matching the design sheet palette
    const jadeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.25, metalness: 0.1 });
    const sandstoneMat = new THREE.MeshStandardMaterial({ color: 0xd6d3d1, roughness: 0.7, metalness: 0.0 });
    const obsidianMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.15, metalness: 0.85 });
    const basaltMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8, metalness: 0.2 });
    const goldAccent = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3, metalness: 0.8 });

    function createArchetypeMesh(owner, nodeIndex) {
      const group = new THREE.Group();
      const isLight = (owner === 1);
      const primaryMat = isLight ? sandstoneMat : basaltMat;
      const specialMat = isLight ? jadeMat : obsidianMat;

      // Classify piece archetype based on deployment position
      let r = Math.floor(nodeIndex / 5);
      let c = nodeIndex % 5;

      // 1. Apex Creature (Phoenix / Dragon)
      if ((isLight && nodeIndex === 2) || (!isLight && nodeIndex === 22)) {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.2, 8), specialMat);
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 5), specialMat);
        body.position.y = 0.4;
        const wings = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.15), goldAccent);
        wings.position.y = 0.45;
        group.add(base, body, wings);
      }
      // 2. Ziggurat Towers (Stepped Pyramids)
      else if (nodeIndex === 1 || nodeIndex === 3 || nodeIndex === 21 || nodeIndex === 23) {
        for (let t = 0; t < 3; t++) {
          const size = 0.65 - (t * 0.16);
          const tier = new THREE.Mesh(new THREE.BoxGeometry(size, 0.2, size), primaryMat);
          tier.position.y = 0.1 + (t * 0.18);
          group.add(tier);
        }
      }
      // 3. Totems (Tall Columns with Wings)
      else if (c === 0 || c === 4) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.9, 8), primaryMat);
        pole.position.y = 0.45;
        const wings = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.1), isLight ? jadeMat : goldAccent);
        wings.position.y = 0.7;
        group.add(pole, wings);
      }
      // 4. Styne Golems (Heavy-Shouldered Monoliths)
      else {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.25, 8), primaryMat);
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.4), primaryMat);
        torso.position.y = 0.35;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.25, 0.28), specialMat);
        head.position.y = 0.65;
        group.add(base, torso, head);
      }

      group.children.forEach(mesh => {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { nodeIndex };
      });
      group.userData = { nodeIndex };
      return group;
    }

    /* =========================================================================
       5. GAME FLOW & INTERACTION LOGIC
       ========================================================================= */
    const game = new Engine();
    let selectedNode = null;
    let availableMoves = [];
    let isAnimating = false;
    let vsComputer = true;

    function spawnAllPieces() {
      pieceMeshes.forEach(mesh => scene.remove(mesh));
      pieceMeshes.clear();

      for (let i = 0; i < NODE_COUNT; i++) {
        const owner = game.board[i];
        if (owner !== 0) {
          const piece = createArchetypeMesh(owner, i);
          piece.position.copy(nodePositions[i]);
          piece.position.y += 0.15;
          scene.add(piece);
          pieceMeshes.set(i, piece);
        }
      }
      updateHUDAndMoveHalos();
    }

    function clearHalos() {
      haloLights.forEach(halo => scene.remove(halo));
      haloLights.length = 0;
    }

    // Visual Indicator: Highlights pieces that have available moves
    function updateHUDAndMoveHalos() {
      clearHalos();

      const allMoves = game.getLegalMoves(game.currentTurn);
      const moveableNodes = new Set(allMoves.map(m => m.from));

      moveableNodes.forEach(nodeIdx => {
        const halo = new THREE.Mesh(
          new THREE.RingGeometry(0.55, 0.72, 16),
          new THREE.MeshBasicMaterial({
            color: game.currentTurn === 1 ? 0x34d399 : 0x94a3b8,
            side: THREE.DoubleSide
          })
        );
        halo.rotation.x = -Math.PI / 2;
        halo.position.copy(nodePositions[nodeIdx]);
        halo.position.y += 0.16;
        scene.add(halo);
        haloLights.push(halo);
      });

      // Update HUD Text
      document.getElementById('p1-score').textContent = game.p1Count;
      document.getElementById('p2-score').textContent = game.p2Count;

      const turnDot = document.getElementById('turn-dot');
      const turnText = document.getElementById('turn-text');
      const isJumpRequired = allMoves.length > 0 && allMoves[0].captures.length > 0;

      if (game.currentTurn === 1) {
        turnDot.style.background = '#34d399';
        turnDot.style.color = '#34d399';
        turnText.textContent = isJumpRequired ? 'LIGHT (JUMP REQUIRED!)' : 'LIGHT TURN';
      } else {
        turnDot.style.background = '#94a3b8';
        turnDot.style.color = '#94a3b8';
        turnText.textContent = vsComputer ? 'COMPUTER...' : (isJumpRequired ? 'DARK (JUMP REQUIRED!)' : 'DARK TURN');
      }
    }

    function clearHighlights() {
      highlightRings.forEach(ring => scene.remove(ring));
      highlightRings.length = 0;
    }

    function showMoveDestinations(moves) {
      clearHighlights();
      for (const m of moves) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.5, 0.75, 24),
          new THREE.MeshBasicMaterial({
            color: m.captures.length > 0 ? 0xef4444 : 0x38bdf8,
            side: THREE.DoubleSide
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(nodePositions[m.to]);
        ring.position.y += 0.16;
        scene.add(ring);
        highlightRings.push(ring);
      }
    }

    function animateMovement(move, onDone) {
      isAnimating = true;
      clearHalos();
      const piece = pieceMeshes.get(move.from);
      pieceMeshes.delete(move.from);

      const waypoints = move.path.map(idx => {
        const p = nodePositions[idx].clone();
        p.y += 0.15;
        return p;
      });

      let stepIndex = 0;
      function step() {
        if (stepIndex >= waypoints.length - 1) {
          piece.userData.nodeIndex = move.to;
          piece.children.forEach(c => c.userData.nodeIndex = move.to);
          pieceMeshes.set(move.to, piece);

          for (const cap of move.captures) {
            const victim = pieceMeshes.get(cap);
            if (victim) {
              scene.remove(victim);
              pieceMeshes.delete(cap);
            }
          }
          isAnimating = false;
          onDone();
          return;
        }

        const start = waypoints[stepIndex], end = waypoints[stepIndex + 1];
        const peak = move.captures.length > 0 ? 1.1 : 0.4;
        let progress = 0;

        function tween() {
          progress += 0.065;
          const t = Math.min(progress, 1);
          const current = new THREE.Vector3().lerpVectors(start, end, t);
          current.y += Math.sin(t * Math.PI) * peak;
          piece.position.copy(current);

          if (t < 1) requestAnimationFrame(tween);
          else { stepIndex++; step(); }
        }
        tween();
      }
      step();
    }

    /* --- TOUCH RAYCASTER --- */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#ui-layer') || e.target.closest('#game-over-modal')) return;
      if (Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY) > 22) return;
      if (isAnimating) return;
      if (vsComputer && game.currentTurn === 2) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const clickable = [...nodeMeshes];
      pieceMeshes.forEach(mesh => mesh.children.forEach(child => clickable.push(child)));

      const intersects = raycaster.intersectObjects(clickable);
      if (intersects.length === 0) return;

      const clickedIndex = intersects[0].object.userData.nodeIndex;
      if (clickedIndex === undefined) return;

      const owner = game.board[clickedIndex];

      // Select piece (only if it has legal moves)
      if (owner === game.currentTurn) {
        const allMoves = game.getLegalMoves(game.currentTurn);
        const legalForThisPiece = allMoves.filter(m => m.from === clickedIndex);

        if (legalForThisPiece.length > 0) {
          selectedNode = clickedIndex;
          availableMoves = legalForThisPiece;
          showMoveDestinations(availableMoves);
          if (navigator.vibrate) navigator.vibrate(15);
        }
        return;
      }

      // Move piece to empty platform
      if (selectedNode !== null) {
        const chosen = availableMoves.find(m => m.to === clickedIndex);
        if (chosen) {
          clearHighlights();
          selectedNode = null;
          if (navigator.vibrate) navigator.vibrate(chosen.captures.length ? [25, 40, 25] : 20);

          animateMovement(chosen, () => {
            game.applyMove(chosen);
            updateHUDAndMoveHalos();
            const res = game.checkResult();
            if (res !== 0) showGameOver(res);
            else if (vsComputer && game.currentTurn === 2) triggerAIMove();
          });
        }
      }
    });

    function triggerAIMove() {
      setTimeout(() => {
        const moves = game.getLegalMoves(2);
        if (moves.length === 0) {
          showGameOver(1);
          return;
        }

        moves.sort((a, b) => {
          if (b.captures.length !== a.captures.length) return b.captures.length - a.captures.length;
          return Math.random() - 0.5;
        });

        const best = moves[0];
        animateMovement(best, () => {
          game.applyMove(best);
          updateHUDAndMoveHalos();
          const res = game.checkResult();
          if (res !== 0) showGameOver(res);
        });
      }, 450);
    }

    function showGameOver(winner) {
      const modal = document.getElementById('game-over-modal');
      modal.style.display = 'flex';
      document.getElementById('modal-title').textContent = winner === 1 ? 'Light Triumph!' : 'Dark Triumph!';
      document.getElementById('modal-desc').textContent = 'Opposing forces eliminated or locked.';
    }

    document.getElementById('btn-restart').onclick = () => {
      document.getElementById('game-over-modal').style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    document.getElementById('modal-btn-restart').onclick = () => {
      document.getElementById('game-over-modal').style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    const btnMode = document.getElementById('btn-mode');
    btnMode.onclick = () => {
      vsComputer = !vsComputer;
      btnMode.textContent = vsComputer ? 'Mode: vs Computer' : 'Mode: 2 Players';
      game.reset();
      spawnAllPieces();
    };

    window.addEventListener('resize', () => {
      handleCameraAspect();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    spawnAllPieces();

    // Pulse Halo Animation Loop
    function renderLoop(time) {
      requestAnimationFrame(renderLoop);

      // Subtle pulse effect on moveable pieces
      const pulse = 0.55 + 0.15 * Math.sin(time * 0.005);
      haloLights.forEach(halo => halo.scale.set(pulse, pulse, 1));

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
