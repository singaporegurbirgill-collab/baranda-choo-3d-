<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baranda Choo">
  <title>Baranda Choo 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(18, 22, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 12px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .turn-chip {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    .scores {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls-card {
      align-self: center;
      display: flex;
      gap: 12px;
      background: rgba(18, 22, 28, 0.88);
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s, background 0.15s;
    }
    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18, 22, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      color: #fff;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
    }
    #game-over-modal h2 { font-size: 22px; font-weight: 800; }
    #game-over-modal p { font-size: 14px; color: #a0aab8; }
    #debug-log {
      display: none;
      position: absolute;
      top: 70px;
      left: 16px;
      right: 16px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-family: monospace;
      z-index: 1000;
      word-break: break-all;
    }
  </style>

  <!-- Stable Three.js r128 + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="debug-log"></div>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="hud-card">
      <div class="turn-chip" id="turn-indicator">
        <span class="color-dot" id="turn-dot" style="background:#4ade80; color:#4ade80;"></span>
        <span id="turn-text">LIGHT TURN</span>
      </div>
      <div class="scores">
        <div class="score-badge">🌿 Light: <span id="p1-score">12</span></div>
        <div class="score-badge">🌋 Dark: <span id="p2-score">12</span></div>
      </div>
    </div>

    <div class="controls-card">
      <button id="btn-mode">Mode: vs Computer</button>
      <button id="btn-restart">Reset Match</button>
    </div>
  </div>

  <div id="game-over-modal">
    <h2 id="modal-title">Victory!</h2>
    <p id="modal-desc">Light side captured all pieces.</p>
    <button id="modal-btn-restart" style="background:#4ade80; color:#0d1117; font-weight:700;">Play Again</button>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const errBox = document.getElementById('debug-log');
      errBox.style.display = 'block';
      errBox.innerHTML = `<b>Error:</b> ${msg}<br><small>Line ${line}</small>`;
    };

    /* --- 1. BOARD TOPOLOGY & ENGINE --- */
    const NODE_COUNT = 25;
    const SPACING = 2.4;
    const ELEVATIONS = [
      0.0, 0.4, 1.4, 0.4, 0.0,
      0.3, 0.9, 0.5, 0.9, 0.3,
      0.0, 0.5, 1.5, 0.5, 0.0,
      0.3, 0.9, 0.5, 0.9, 0.3,
      0.0, 0.4, 0.8, 0.4, 0.0
    ];

    const Adjacency = Array.from({ length: NODE_COUNT }, () => []);
    const JumpTable = Array.from({ length: NODE_COUNT }, () => []);

    const drOrth = [-1, 1, 0, 0], dcOrth = [0, 0, -1, 1];
    const drDiag = [-1, -1, 1, 1], dcDiag = [-1, 1, -1, 1];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const from = r * 5 + c;
        const hasDiag = ((r + c) % 2 === 0);

        for (let d = 0; d < 4; d++) {
          const nr = r + drOrth[d], nc = c + dcOrth[d];
          if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
            Adjacency[from].push(nr * 5 + nc);
            const jnr = r + 2 * drOrth[d], jnc = c + 2 * dcOrth[d];
            if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
              JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
            }
          }
        }

        if (hasDiag) {
          for (let d = 0; d < 4; d++) {
            const nr = r + drDiag[d], nc = c + dcDiag[d];
            if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
              Adjacency[from].push(nr * 5 + nc);
              const jnr = r + 2 * drDiag[d], jnc = c + 2 * dcDiag[d];
              if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
                JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
              }
            }
          }
        }
      }
    }

    class Engine {
      constructor() {
        this.board = new Uint8Array(NODE_COUNT);
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
        this.mandatoryCapture = true;
        this.reset();
      }

      reset() {
        for (let i = 0; i < 12; i++) this.board[i] = 1;
        this.board[12] = 0;
        for (let i = 13; i < 25; i++) this.board[i] = 2;
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
      }

      getLegalMoves(player) {
        const opponent = player === 1 ? 2 : 1;
        const captures = [];
        const steps = [];

        for (let i = 0; i < NODE_COUNT; i++) {
          if (this.board[i] !== player) continue;
          this.findJumpsRecursive(i, i, [i], new Set(), captures, opponent);

          for (const target of Adjacency[i]) {
            if (this.board[target] === 0) {
              steps.push({ from: i, to: target, path: [i, target], captures: [] });
            }
          }
        }
        return (this.mandatoryCapture && captures.length > 0) ? captures : (captures.length > 0 ? captures.concat(steps) : steps);
      }

      findJumpsRecursive(origin, current, path, capturedSet, results, opponent) {
        let branched = false;
        for (const jump of JumpTable[current]) {
          if (this.board[jump.over] === opponent && !capturedSet.has(jump.over)) {
            if (this.board[jump.to] === 0 || jump.to === origin) {
              branched = true;
              capturedSet.add(jump.over);
              path.push(jump.to);
              this.findJumpsRecursive(origin, jump.to, path, capturedSet, results, opponent);
              path.pop();
              capturedSet.delete(jump.over);
            }
          }
        }
        if (!branched && capturedSet.size > 0) {
          results.push({
            from: origin,
            to: current,
            path: [...path],
            captures: Array.from(capturedSet)
          });
        }
      }

      applyMove(move) {
        this.board[move.to] = this.board[move.from];
        this.board[move.from] = 0;
        for (const cap of move.captures) {
          this.board[cap] = 0;
          if (this.currentTurn === 1) this.p2Count--;
          else this.p1Count--;
        }
        this.currentTurn = this.currentTurn === 1 ? 2 : 1;
      }

      checkResult() {
        if (this.p1Count === 0) return 2;
        if (this.p2Count === 0) return 1;
        if (this.getLegalMoves(this.currentTurn).length === 0) return this.currentTurn === 1 ? 2 : 1;
        return 0;
      }
    }

    /* --- 2. THREE.JS SCENE SETUP & ADAPTIVE FOV --- */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10141d);
    scene.fog = new THREE.FogExp2(0x10141d, 0.022);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    function adjustCameraForOrientation() {
      const isPortrait = window.innerWidth < window.innerHeight;
      if (isPortrait) {
        camera.fov = 60;
        camera.position.set(0, 19, 18);
      } else {
        camera.fov = 45;
        camera.position.set(0, 15, 16);
      }
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    adjustCameraForOrientation();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    let controls = null;
    if (typeof THREE.OrbitControls !== 'undefined') {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2.2;
      controls.minDistance = 8;
      controls.maxDistance = 30;
      controls.target.set(0, 0.6, 0);
    }

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.1));
    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.4);
    dirLight.position.set(10, 22, 12);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(13, 0.6, 13),
      new THREE.MeshStandardMaterial({ color: 0x1e2634, roughness: 0.9 })
    );
    slab.position.y = -0.35;
    scene.add(slab);

    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.75 });
    const p1Mat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.35 });
    const p2Mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45 });
    const viaductMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 });

    const nodePositions = [];
    const nodeMeshes = [];
    const pieceMeshes = new Map();
    const highlightRings = [];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const i = r * 5 + c;
        const pos = new THREE.Vector3((c - 2) * SPACING, ELEVATIONS[i], (r - 2) * SPACING);
        nodePositions.push(pos);

        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.76, 0.22, 16), stoneMat);
        mesh.position.copy(pos);
        mesh.userData = { nodeIndex: i };
        scene.add(mesh);
        nodeMeshes.push(mesh);
      }
    }

    const drawnLines = new Set();
    for (let i = 0; i < NODE_COUNT; i++) {
      for (const adj of Adjacency[i]) {
        const min = Math.min(i, adj), max = Math.max(i, adj);
        if (!drawnLines.has(`${min}-${max}`)) {
          drawnLines.add(`${min}-${max}`);
          const pA = nodePositions[min], pB = nodePositions[max];
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, pA.distanceTo(pB)), viaductMat);
          bridge.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
          bridge.position.y -= 0.04;
          bridge.lookAt(pB);
          scene.add(bridge);
        }
      }
    }

    /* --- 3. PIECES & ACCURATE TOUCH PICKING --- */
    const game = new Engine();
    let selectedNode = null;
    let availableMoves = [];
    let isAnimating = false;
    let vsComputer = true;

    function createPieceMesh(owner, nodeIndex) {
      const group = new THREE.Group();
      const mat = owner === 1 ? p1Mat : p2Mat;
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.28, 18), mat);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12), mat);
      cap.position.y = 0.16;
      group.add(base);
      group.add(cap);

      base.userData = { nodeIndex };
      cap.userData = { nodeIndex };
      group.userData = { nodeIndex };
      return group;
    }

    function spawnAllPieces() {
      pieceMeshes.forEach(mesh => scene.remove(mesh));
      pieceMeshes.clear();
      for (let i = 0; i < NODE_COUNT; i++) {
        const owner = game.board[i];
        if (owner !== 0) {
          const piece = createPieceMesh(owner, i);
          piece.position.copy(nodePositions[i]);
          piece.position.y += 0.18;
          scene.add(piece);
          pieceMeshes.set(i, piece);
        }
      }
      updateHUD();
    }

    function clearHighlights() {
      highlightRings.forEach(ring => scene.remove(ring));
      highlightRings.length = 0;
    }

    function showHighlights(moves) {
      clearHighlights();
      for (const m of moves) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.52, 0.72, 24),
          new THREE.MeshBasicMaterial({ color: m.captures.length > 0 ? 0xef4444 : 0x38bdf8, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(nodePositions[m.to]);
        ring.position.y += 0.14;
        scene.add(ring);
        highlightRings.push(ring);
      }
    }

    function animateMovement(move, onDone) {
      isAnimating = true;
      const piece = pieceMeshes.get(move.from);
      pieceMeshes.delete(move.from);

      const waypoints = move.path.map(idx => {
        const p = nodePositions[idx].clone();
        p.y += 0.18;
        return p;
      });

      let stepIndex = 0;
      function step() {
        if (stepIndex >= waypoints.length - 1) {
          piece.userData.nodeIndex = move.to;
          piece.children.forEach(c => c.userData.nodeIndex = move.to);
          pieceMeshes.set(move.to, piece);

          for (const cap of move.captures) {
            const victim = pieceMeshes.get(cap);
            if (victim) {
              scene.remove(victim);
              pieceMeshes.delete(cap);
            }
          }
          isAnimating = false;
          onDone();
          return;
        }

        const start = waypoints[stepIndex], end = waypoints[stepIndex + 1];
        const peak = move.captures.length > 0 ? 1.1 : 0.45;
        let progress = 0;

        function tween() {
          progress += 0.065;
          const t = Math.min(progress, 1);
          const current = new THREE.Vector3().lerpVectors(start, end, t);
          current.y += Math.sin(t * Math.PI) * peak;
          piece.position.copy(current);

          if (t < 1) requestAnimationFrame(tween);
          else { stepIndex++; step(); }
        }
        tween();
      }
      step();
    }

    /* --- 4. TOUCH INPUT --- */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#ui-layer') || e.target.closest('#game-over-modal')) return;

      const dist = Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY);
      if (dist > 22) return;

      if (isAnimating) return;
      if (vsComputer && game.currentTurn === 2) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const targetObjects = [...nodeMeshes];
      pieceMeshes.forEach(mesh => {
        mesh.children.forEach(child => targetObjects.push(child));
      });

      const intersects = raycaster.intersectObjects(targetObjects);
      if (intersects.length === 0) return;

      const hit = intersects[0].object;
      const clickedIndex = hit.userData.nodeIndex;
      if (clickedIndex === undefined) return;

      const clickedPieceOwner = game.board[clickedIndex];

      if (clickedPieceOwner === game.currentTurn) {
        selectedNode = clickedIndex;
        const allLegal = game.getLegalMoves(game.currentTurn);
        availableMoves = allLegal.filter(m => m.from === clickedIndex);
        showHighlights(availableMoves);
        if (navigator.vibrate) navigator.vibrate(15);
        return;
      }

      if (selectedNode !== null) {
        const chosen = availableMoves.find(m => m.to === clickedIndex);
        if (chosen) {
          clearHighlights();
          selectedNode = null;
          if (navigator.vibrate) navigator.vibrate(chosen.captures.length ? [25, 40, 25] : 20);

          animateMovement(chosen, () => {
            game.applyMove(chosen);
            updateHUD();
            const res = game.checkResult();
            if (res !== 0) showGameOver(res);
            else if (vsComputer && game.currentTurn === 2) triggerAIMove();
          });
        }
      }
    });

    function triggerAIMove() {
      setTimeout(() => {
        const moves = game.getLegalMoves(2);
        if (moves.length === 0) {
          showGameOver(1);
          return;
        }

        moves.sort((a, b) => {
          if (b.captures.length !== a.captures.length) return b.captures.length - a.captures.length;
          return Math.random() - 0.5;
        });

        const best = moves[0];
        animateMovement(best, () => {
          game.applyMove(best);
          updateHUD();
          const res = game.checkResult();
          if (res !== 0) showGameOver(res);
        });
      }, 400);
    }

    /* --- 5. UI HUD & DYNAMIC RESIZE --- */
    const turnDot = document.getElementById('turn-dot');
    const turnText = document.getElementById('turn-text');
    const p1Score = document.getElementById('p1-score');
    const p2Score = document.getElementById('p2-score');
    const modal = document.getElementById('game-over-modal');

    function updateHUD() {
      p1Score.textContent = game.p1Count;
      p2Score.textContent = game.p2Count;

      const allMoves = game.getLegalMoves(game.currentTurn);
      const hasMandatoryCapture = allMoves.length > 0 && allMoves[0].captures.length > 0;

      if (game.currentTurn === 1) {
        turnDot.style.background = '#4ade80';
        turnDot.style.color = '#4ade80';
        turnText.textContent = hasMandatoryCapture ? 'LIGHT (JUMP REQUIRED!)' : 'LIGHT TURN';
      } else {
        turnDot.style.background = '#94a3b8';
        turnDot.style.color = '#94a3b8';
        turnText.textContent = vsComputer ? 'COMPUTER...' : (hasMandatoryCapture ? 'DARK (JUMP REQUIRED!)' : 'DARK TURN');
      }
    }

    function showGameOver(winner) {
      modal.style.display = 'flex';
      document.getElementById('modal-title').textContent = winner === 1 ? 'Light Triumph!' : 'Dark Triumph!';
      document.getElementById('modal-desc').textContent = `Winner eliminated or locked the opposing forces.`;
    }

    document.getElementById('btn-restart').onclick = () => {
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    document.getElementById('modal-btn-restart').onclick = () => {
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    const btnMode = document.getElementById('btn-mode');
    btnMode.onclick = () => {
      vsComputer = !vsComputer;
      btnMode.textContent = vsComputer ? 'Mode: vs Computer' : 'Mode: 2 Players';
      game.reset();
      spawnAllPieces();
    };

    window.addEventListener('resize', () => {
      adjustCameraForOrientation();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    spawnAllPieces();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
