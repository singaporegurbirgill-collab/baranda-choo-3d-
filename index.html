<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baranda Choo 3D - Forest Canyon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1313;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 30px) 16px env(safe-area-inset-bottom, 24px) 16px;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(13, 22, 22, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .turn-chip {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }
    .scores {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .controls-card {
      align-self: center;
      display: flex;
      gap: 12px;
      background: rgba(13, 22, 22, 0.9);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s, background 0.15s;
    }
    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 22, 22, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      color: #fff;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="hud-card">
      <div class="turn-chip">
        <span class="color-dot" id="turn-dot" style="background:#4ade80; color:#4ade80;"></span>
        <span id="turn-text">LIGHT TURN</span>
      </div>
      <div class="scores">
        <div>🌿 Light: <span id="p1-score">12</span></div>
        <div>🌋 Dark: <span id="p2-score">12</span></div>
      </div>
    </div>

    <div class="controls-card">
      <button id="btn-mode">Mode: vs Computer</button>
      <button id="btn-restart">Reset Match</button>
    </div>
  </div>

  <div id="game-over-modal">
    <h2 id="modal-title">Victory!</h2>
    <p id="modal-desc">All opposing pieces eliminated.</p>
    <button id="modal-btn-restart" style="background:#4ade80; color:#0b1313; font-weight:700;">Play Again</button>
  </div>

  <script>
    /* =========================================================================
       1. GAME RULES ENGINE (OPTIONAL CAPTURES ENABLED)
       ========================================================================= */
    const NODE_COUNT = 25;
    const SPACING = 2.4;

    // Mountain Canyon elevation profile matching reference sheet
    const ELEVATIONS = [
      0.0, 0.6, 2.0, 0.6, 0.0, // Row 0 (North Summit at Node 2)
      0.4, 1.2, 0.7, 1.2, 0.4, // Row 1
      0.0, 0.7, 2.2, 0.7, 0.0, // Row 2 (Central Summit Altar at Node 12)
      0.4, 1.2, 0.7, 1.2, 0.4, // Row 3
      0.0, 0.6, 1.0, 0.6, 0.0  // Row 4
    ];

    const Adjacency = Array.from({ length: NODE_COUNT }, () => []);
    const JumpTable = Array.from({ length: NODE_COUNT }, () => []);

    const drOrth = [-1, 1, 0, 0], dcOrth = [0, 0, -1, 1];
    const drDiag = [-1, -1, 1, 1], dcDiag = [-1, 1, -1, 1];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const from = r * 5 + c;
        const hasDiag = ((r + c) % 2 === 0);

        for (let d = 0; d < 4; d++) {
          const nr = r + drOrth[d], nc = c + dcOrth[d];
          if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
            Adjacency[from].push(nr * 5 + nc);
            const jnr = r + 2 * drOrth[d], jnc = c + 2 * dcOrth[d];
            if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
              JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
            }
          }
        }

        if (hasDiag) {
          for (let d = 0; d < 4; d++) {
            const nr = r + drDiag[d], nc = c + dcDiag[d];
            if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
              Adjacency[from].push(nr * 5 + nc);
              const jnr = r + 2 * drDiag[d], jnc = c + 2 * dcDiag[d];
              if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
                JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
              }
            }
          }
        }
      }
    }

    class Engine {
      constructor() {
        this.board = new Uint8Array(NODE_COUNT);
        this.currentTurn = 1; // 1 = Light, 2 = Dark
        this.p1Count = 12;
        this.p2Count = 12;
        this.reset();
      }

      reset() {
        for (let i = 0; i < 12; i++) this.board[i] = 1;
        this.board[12] = 0; // Central shrine initially empty
        for (let i = 13; i < 25; i++) this.board[i] = 2;
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
      }

      // FULL FREEDOM: Returns BOTH captures and simple steps without forcing jumps
      getLegalMoves(player) {
        const opponent = player === 1 ? 2 : 1;
        const captures = [];
        const steps = [];

        for (let i = 0; i < NODE_COUNT; i++) {
          if (this.board[i] !== player) continue;
          this.findJumpsRecursive(i, i, [i], new Set(), captures, opponent);

          for (const target of Adjacency[i]) {
            if (this.board[target] === 0) {
              steps.push({ from: i, to: target, path: [i, target], captures: [] });
            }
          }
        }
        return captures.concat(steps);
      }

      findJumpsRecursive(origin, current, path, capturedSet, results, opponent) {
        let branched = false;
        for (const jump of JumpTable[current]) {
          if (this.board[jump.over] === opponent && !capturedSet.has(jump.over)) {
            if (this.board[jump.to] === 0 || jump.to === origin) {
              branched = true;
              capturedSet.add(jump.over);
              path.push(jump.to);
              this.findJumpsRecursive(origin, jump.to, path, capturedSet, results, opponent);
              path.pop();
              capturedSet.delete(jump.over);
            }
          }
        }
        if (!branched && capturedSet.size > 0) {
          results.push({
            from: origin,
            to: current,
            path: [...path],
            captures: Array.from(capturedSet)
          });
        }
      }

      applyMove(move) {
        this.board[move.to] = this.board[move.from];
        this.board[move.from] = 0;
        for (const cap of move.captures) {
          this.board[cap] = 0;
          if (this.currentTurn === 1) this.p2Count--;
          else this.p1Count--;
        }
        this.currentTurn = this.currentTurn === 1 ? 2 : 1;
      }

      checkResult() {
        if (this.p1Count === 0) return 2;
        if (this.p2Count === 0) return 1;
        if (this.getLegalMoves(this.currentTurn).length === 0) return this.currentTurn === 1 ? 2 : 1;
        return 0;
      }
    }

    /* =========================================================================
       2. THREE.JS ISOMETRIC ENVIRONMENT & LIGHTING
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1919);
    scene.fog = new THREE.FogExp2(0x0c1919, 0.024);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    function setupIsometricCamera() {
      // Classic 3/4 isometric perspective matching reference sheet
      camera.position.set(16, 21, 16);
      camera.lookAt(0, 0.8, 0);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    setupIsometricCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 9;
    controls.maxDistance = 34;
    controls.target.set(0, 0.8, 0);

    // Warm Sun and Atmospheric Forest Fill
    scene.add(new THREE.HemisphereLight(0xd1fae5, 0x064e3b, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfffae0, 1.8);
    sunLight.position.set(16, 28, 14);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    /* =========================================================================
       3. PROCEDURAL CANYON, TREES, & VIADUCT BRIDGES
       ========================================================================= */
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.85 });
    const mossMat = new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.9 });
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.8 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x0891b2, roughness: 0.1, metalness: 0.85 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.95 });

    // Canyon Abyss & Chasm Floor
    const canyonFloor = new THREE.Mesh(new THREE.BoxGeometry(22, 1, 22), mossMat);
    canyonFloor.position.y = -2.2;
    canyonFloor.receiveShadow = true;
    scene.add(canyonFloor);

    // River Channel Cutting Through Chasm
    const river = new THREE.Mesh(new THREE.PlaneGeometry(8, 22), waterMat);
    river.rotation.x = -Math.PI / 2;
    river.rotation.z = Math.PI / 4;
    river.position.y = -2.15;
    river.receiveShadow = true;
    scene.add(river);

    // Outer Fortress Retaining Walls with Relief Carving Trim
    const outerWall = new THREE.Mesh(new THREE.BoxGeometry(16.5, 2.5, 16.5), wallMat);
    outerWall.position.y = -1.25;
    outerWall.receiveShadow = true;
    scene.add(outerWall);

    // North Mountain Peak Crag behind Node 2
    const mountainPeak = new THREE.Group();
    const peak1 = new THREE.Mesh(new THREE.ConeGeometry(3.5, 7.5, 6), stoneMat);
    peak1.position.set(0, 2.8, -8.5);
    peak1.castShadow = true;
    const peak2 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5.5, 5), mossMat);
    peak2.position.set(-3.2, 1.8, -7.8);
    peak2.castShadow = true;
    mountainPeak.add(peak1, peak2);
    scene.add(mountainPeak);

    // Procedural Pine and Deciduous Forest Clusters
    const forestGroup = new THREE.Group();
    function plantPineTree(x, y, z, scale) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * scale, 0.16 * scale, 1.2 * scale, 6), woodMat);
      trunk.position.set(x, y + 0.6 * scale, z);
      trunk.castShadow = true;

      const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.9 * scale, 2.2 * scale, 6), pineMat);
      foliage.position.set(x, y + 1.8 * scale, z);
      foliage.castShadow = true;

      forestGroup.add(trunk, foliage);
    }

    // Populate Canyon Slopes with Foliage
    for (let f = 0; f < 45; f++) {
      const angle = (f / 45) * Math.PI * 2;
      const radius = 6.8 + (f % 5) * 0.45;
      const tx = Math.cos(angle) * radius;
      const tz = Math.sin(angle) * radius;
      if (tz < -5 && Math.abs(tx) < 2) continue; // Keep space clear for mountain peak
      plantPineTree(tx, -2.0, tz, 0.7 + (f % 4) * 0.2);
    }
    scene.add(forestGroup);

    // Build 25 Elevated Octagonal Pedestals & Arched Bridges
    const nodePositions = [];
    const nodeMeshes = [];
    const pieceMeshes = new Map();
    const highlightRings = [];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const i = r * 5 + c;
        const pos = new THREE.Vector3((c - 2) * SPACING, ELEVATIONS[i], (r - 2) * SPACING);
        nodePositions.push(pos);

        // Concentric Stepped Octagonal Dais
        const platform = new THREE.Group();
        const baseDais = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.05, 0.16, 8), stoneMat);
        const topDais = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.85, 0.12, 8), mossMat);
        topDais.position.y = 0.12;
        platform.add(baseDais, topDais);

        platform.position.copy(pos);
        baseDais.receiveShadow = true;
        topDais.receiveShadow = true;
        baseDais.userData = { nodeIndex: i };
        topDais.userData = { nodeIndex: i };
        platform.userData = { nodeIndex: i };

        scene.add(platform);
        nodeMeshes.push(topDais);

        // Solid Stone Masonry Viaduct Pillar descending to Canyon Depth
        const pillarDepth = pos.y + 2.2;
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, pillarDepth, 8), stoneMat);
        pillar.position.set(pos.x, pos.y - pillarDepth / 2, pos.z);
        pillar.receiveShadow = true;
        scene.add(pillar);
      }
    }

    // Build Arched Masonry Viaducts Connecting Platforms
    const drawnLines = new Set();
    for (let i = 0; i < NODE_COUNT; i++) {
      for (const adj of Adjacency[i]) {
        const min = Math.min(i, adj), max = Math.max(i, adj);
        if (!drawnLines.has(`${min}-${max}`)) {
          drawnLines.add(`${min}-${max}`);
          const pA = nodePositions[min], pB = nodePositions[max];
          const dist = pA.distanceTo(pB);

          const bridgeGroup = new THREE.Group();
          // Roadway deck
          const deck = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, dist), stoneMat);
          // Arch belly under the bridge
          const archBelly = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.28, dist * 0.75), wallMat);
          archBelly.position.y = -0.16;

          bridgeGroup.add(deck, archBelly);
          bridgeGroup.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
          bridgeGroup.position.y -= 0.06;
          bridgeGroup.lookAt(pB);
          deck.receiveShadow = true;
          scene.add(bridgeGroup);
        }
      }
    }

    /* =========================================================================
       4. SCULPTED ASYMMETRIC PIECE MODELS
       ========================================================================= */
    const jadeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, metalness: 0.1 });
    const sandstoneMat = new THREE.MeshStandardMaterial({ color: 0xd6d3d1, roughness: 0.65 });
    const obsidianMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.15, metalness: 0.85 });
    const basaltMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.75, metalness: 0.2 });
    const bronzeAccent = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.35, metalness: 0.8 });

    function createSculptedUnit(owner, nodeIndex) {
      const group = new THREE.Group();
      const isLight = (owner === 1);
      const primaryMat = isLight ? sandstoneMat : basaltMat;
      const specialMat = isLight ? jadeMat : obsidianMat;

      const c = nodeIndex % 5;

      // 1. Apex Creature: Jade Phoenix (Side A, Node 2) / Obsidian Dragon (Side B, Node 22)
      if ((isLight && nodeIndex === 2) || (!isLight && nodeIndex === 22)) {
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.85, 5), specialMat);
        body.position.y = 0.45;
        const wings = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.18), bronzeAccent);
        wings.position.y = 0.55;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), specialMat);
        head.position.set(0, 0.9, 0.1);
        group.add(body, wings, head);
      }
      // 2. Stepped Ziggurat Pyramids (Nodes 1, 3, 21, 23)
      else if (nodeIndex === 1 || nodeIndex === 3 || nodeIndex === 21 || nodeIndex === 23) {
        for (let t = 0; t < 4; t++) {
          const size = 0.72 - (t * 0.15);
          const tier = new THREE.Mesh(new THREE.BoxGeometry(size, 0.16, size), primaryMat);
          tier.position.y = 0.08 + (t * 0.16);
          group.add(tier);
        }
      }
      // 3. Winged Totem Poles (Corner columns: Column 0 & Column 4)
      else if (c === 0 || c === 4) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 1.1, 8), primaryMat);
        pole.position.y = 0.55;
        const crossWing = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.14, 0.12), specialMat);
        crossWing.position.y = 0.85;
        group.add(pole, crossWing);
      }
      // 4. Styne Golems (Heavy Stone Titans: Vanguard & Central line)
      else {
        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.28, 0.35), primaryMat);
        legs.position.y = 0.14;
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.48, 0.42), primaryMat);
        torso.position.y = 0.48;
        const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.18, 0.35), specialMat);
        shoulders.position.y = 0.62;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.24, 0.26), bronzeAccent);
        head.position.y = 0.82;
        group.add(legs, torso, shoulders, head);
      }

      group.children.forEach(child => {
        child.castShadow = true;
        child.receiveShadow = true;
        child.userData = { nodeIndex };
      });
      group.userData = { nodeIndex };
      return group;
    }

    /* =========================================================================
       5. GAME STATE & TOUCH INTERACTION (ANY PIECE CAN MOVE)
       ========================================================================= */
    const game = new Engine();
    let selectedNode = null;
    let availableMoves = [];
    let isAnimating = false;
    let vsComputer = true;

    function spawnAllPieces() {
      pieceMeshes.forEach(mesh => scene.remove(mesh));
      pieceMeshes.clear();

      for (let i = 0; i < NODE_COUNT; i++) {
        const owner = game.board[i];
        if (owner !== 0) {
          const piece = createSculptedUnit(owner, i);
          piece.position.copy(nodePositions[i]);
          piece.position.y += 0.16;
          scene.add(piece);
          pieceMeshes.set(i, piece);
        }
      }
      updateHUD();
    }

    function clearHighlights() {
      highlightRings.forEach(ring => scene.remove(ring));
      highlightRings.length = 0;
    }

    function showMoveDestinations(moves) {
      clearHighlights();
      for (const m of moves) {
        // Red for capture leaps, Cyan for simple steps
        const isCapture = m.captures.length > 0;
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.55, 0.78, 24),
          new THREE.MeshBasicMaterial({
            color: isCapture ? 0xef4444 : 0x38bdf8,
            side: THREE.DoubleSide
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(nodePositions[m.to]);
        ring.position.y += 0.22;
        scene.add(ring);
        highlightRings.push(ring);
      }
    }

    function animateMovement(move, onDone) {
      isAnimating = true;
      const piece = pieceMeshes.get(move.from);
      pieceMeshes.delete(move.from);

      const waypoints = move.path.map(idx => {
        const p = nodePositions[idx].clone();
        p.y += 0.16;
        return p;
      });

      let stepIndex = 0;
      function step() {
        if (stepIndex >= waypoints.length - 1) {
          piece.userData.nodeIndex = move.to;
          piece.children.forEach(c => c.userData.nodeIndex = move.to);
          pieceMeshes.set(move.to, piece);

          for (const cap of move.captures) {
            const victim = pieceMeshes.get(cap);
            if (victim) {
              scene.remove(victim);
              pieceMeshes.delete(cap);
            }
          }
          isAnimating = false;
          onDone();
          return;
        }

        const start = waypoints[stepIndex], end = waypoints[stepIndex + 1];
        const isJump = move.captures.length > 0;
        const peak = isJump ? 1.2 : 0.45;
        let progress = 0;

        function tween() {
          progress += 0.065;
          const t = Math.min(progress, 1);
          const current = new THREE.Vector3().lerpVectors(start, end, t);
          current.y += Math.sin(t * Math.PI) * peak;
          piece.position.copy(current);

          if (t < 1) requestAnimationFrame(tween);
          else { stepIndex++; step(); }
        }
        tween();
      }
      step();
    }

    /* --- TOUCH RAYCASTER (NO OVERLAP / BLEED-THROUGH) --- */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#ui-layer') || e.target.closest('#game-over-modal')) return;
      if (Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY) > 22) return;
      if (isAnimating) return;
      if (vsComputer && game.currentTurn === 2) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const clickable = [...nodeMeshes];
      pieceMeshes.forEach(mesh => mesh.children.forEach(child => clickable.push(child)));

      const intersects = raycaster.intersectObjects(clickable);
      if (intersects.length === 0) return;

      const clickedIndex = intersects[0].object.userData.nodeIndex;
      if (clickedIndex === undefined) return;

      const owner = game.board[clickedIndex];

      // Select piece if it belongs to current player
      if (owner === game.currentTurn) {
        const allMoves = game.getLegalMoves(game.currentTurn);
        const legalForThisPiece = allMoves.filter(m => m.from === clickedIndex);

        // Player can select any piece that has any move (step or jump)
        if (legalForThisPiece.length > 0) {
          selectedNode = clickedIndex;
          availableMoves = legalForThisPiece;
          showMoveDestinations(availableMoves);
          if (navigator.vibrate) navigator.vibrate(15);
        }
        return;
      }

      // Move selected piece to empty platform
      if (selectedNode !== null) {
        const chosen = availableMoves.find(m => m.to === clickedIndex);
        if (chosen) {
          clearHighlights();
          selectedNode = null;
          if (navigator.vibrate) navigator.vibrate(chosen.captures.length ? [25, 40, 25] : 20);

          animateMovement(chosen, () => {
            game.applyMove(chosen);
            updateHUD();
            const res = game.checkResult();
            if (res !== 0) showGameOver(res);
            else if (vsComputer && game.currentTurn === 2) triggerAIMove();
          });
        }
      }
    });

    function triggerAIMove() {
      setTimeout(() => {
        const moves = game.getLegalMoves(2);
        if (moves.length === 0) {
          showGameOver(1);
          return;
        }

        // AI prefers captures if available, otherwise picks smart move
        moves.sort((a, b) => {
          if (b.captures.length !== a.captures.length) return b.captures.length - a.captures.length;
          return Math.random() - 0.5;
        });

        const best = moves[0];
        animateMovement(best, () => {
          game.applyMove(best);
          updateHUD();
          const res = game.checkResult();
          if (res !== 0) showGameOver(res);
        });
      }, 400);
    }

    /* =========================================================================
       6. UI CONTROLS & RENDER LOOP
       ========================================================================= */
    const turnDot = document.getElementById('turn-dot');
    const turnText = document.getElementById('turn-text');
    const p1Score = document.getElementById('p1-score');
    const p2Score = document.getElementById('p2-score');
    const modal = document.getElementById('game-over-modal');

    function updateHUD() {
      p1Score.textContent = game.p1Count;
      p2Score.textContent = game.p2Count;

      if (game.currentTurn === 1) {
        turnDot.style.background = '#4ade80';
        turnDot.style.color = '#4ade80';
        turnText.textContent = 'LIGHT TURN';
      } else {
        turnDot.style.background = '#94a3b8';
        turnDot.style.color = '#94a3b8';
        turnText.textContent = vsComputer ? 'COMPUTER...' : 'DARK TURN';
      }
    }

    function showGameOver(winner) {
      modal.style.display = 'flex';
      document.getElementById('modal-title').textContent = winner === 1 ? 'Light Triumph!' : 'Dark Triumph!';
      document.getElementById('modal-desc').textContent = 'Opposing army eliminated or trapped.';
    }

    document.getElementById('btn-restart').onclick = () => {
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    document.getElementById('modal-btn-restart').onclick = () => {
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    const btnMode = document.getElementById('btn-mode');
    btnMode.onclick = () => {
      vsComputer = !vsComputer;
      btnMode.textContent = vsComputer ? 'Mode: vs Computer' : 'Mode: 2 Players';
      game.reset();
      spawnAllPieces();
    };

    window.addEventListener('resize', () => {
      setupIsometricCamera();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    spawnAllPieces();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
