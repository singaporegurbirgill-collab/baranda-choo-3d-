<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baranda Choo 3D - Forest Mountain</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070e0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 34px) 16px env(safe-area-inset-bottom, 24px) 16px;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(10, 18, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 12px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }
    .turn-chip {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }
    .scores {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .bottom-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #btn-finish-turn {
      display: none;
      pointer-events: auto;
      background: #f59e0b;
      color: #070e0e;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 24px;
      border: 1px solid #fbbf24;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
      animation: pulse-btn 1.4s infinite;
      cursor: pointer;
    }
    @keyframes pulse-btn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .controls-card {
      align-self: center;
      display: flex;
      gap: 8px;
      background: rgba(10, 18, 18, 0.92);
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 18px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s, background 0.15s;
    }
    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 18, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      color: #fff;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
    }
    #legend-bar {
      align-self: center;
      display: flex;
      gap: 12px;
      background: rgba(10, 18, 18, 0.7);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot-step { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; }
    .dot-jump { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="hud-card">
      <div class="turn-chip">
        <span class="color-dot" id="turn-dot" style="background:#4ade80; color:#4ade80;"></span>
        <span id="turn-text">LIGHT TURN</span>
      </div>
      <div class="scores">
        <div>🌿 Light: <span id="p1-score">12</span></div>
        <div>🌋 Dark: <span id="p2-score">12</span></div>
      </div>
    </div>

    <div class="bottom-stack">
      <button id="btn-finish-turn">Finish Turn (Stop Here)</button>

      <div id="legend-bar">
        <div class="legend-item"><span class="dot-step"></span> Step</div>
        <div class="legend-item"><span class="dot-jump"></span> Jump (Chainable)</div>
      </div>

      <div class="controls-card">
        <button id="btn-mode">Mode: vs Computer</button>
        <button id="btn-guide">Guide: ON</button>
        <button id="btn-restart">Reset Match</button>
      </div>
    </div>
  </div>

  <div id="game-over-modal">
    <h2 id="modal-title">Victory!</h2>
    <p id="modal-desc">All opposing units defeated.</p>
    <button id="modal-btn-restart" style="background:#4ade80; color:#070e0e; font-weight:700;">Play Again</button>
  </div>

  <script>
    /* =========================================================================
       1. GAME RULES ENGINE (UNLIMITED JUMPS, LOOPS, & STRATEGIC EARLY STOPS)
       ========================================================================= */
    const NODE_COUNT = 25;
    const SPACING = 2.4;

    const ELEVATIONS = [
      0.0, 0.6, 2.0, 0.6, 0.0,
      0.4, 1.2, 0.7, 1.2, 0.4,
      0.0, 0.7, 2.2, 0.7, 0.0,
      0.4, 1.2, 0.7, 1.2, 0.4,
      0.0, 0.6, 1.0, 0.6, 0.0
    ];

    const Adjacency = Array.from({ length: NODE_COUNT }, () => []);
    const JumpTable = Array.from({ length: NODE_COUNT }, () => []);

    const drOrth = [-1, 1, 0, 0], dcOrth = [0, 0, -1, 1];
    const drDiag = [-1, -1, 1, 1], dcDiag = [-1, 1, -1, 1];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const from = r * 5 + c;
        const hasDiag = ((r + c) % 2 === 0);

        for (let d = 0; d < 4; d++) {
          const nr = r + drOrth[d], nc = c + dcOrth[d];
          if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
            Adjacency[from].push(nr * 5 + nc);
            const jnr = r + 2 * drOrth[d], jnc = c + 2 * dcOrth[d];
            if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
              JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
            }
          }
        }

        if (hasDiag) {
          for (let d = 0; d < 4; d++) {
            const nr = r + drDiag[d], nc = c + dcDiag[d];
            if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
              Adjacency[from].push(nr * 5 + nc);
              const jnr = r + 2 * drDiag[d], jnc = c + 2 * dcDiag[d];
              if (jnr >= 0 && jnr < 5 && jnc >= 0 && jnc < 5) {
                JumpTable[from].push({ over: nr * 5 + nc, to: jnr * 5 + jnc });
              }
            }
          }
        }
      }
    }

    class Engine {
      constructor() {
        this.board = new Uint8Array(NODE_COUNT);
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
        this.reset();
      }

      reset() {
        for (let i = 0; i < 12; i++) this.board[i] = 1;
        this.board[12] = 0;
        for (let i = 13; i < 25; i++) this.board[i] = 2;
        this.currentTurn = 1;
        this.p1Count = 12;
        this.p2Count = 12;
      }

      getLegalMoves(player) {
        const opponent = player === 1 ? 2 : 1;
        const moves = [];

        for (let i = 0; i < NODE_COUNT; i++) {
          if (this.board[i] !== player) continue;

          // Temporarily vacate origin node during jump exploration
          this.board[i] = 0;
          this.findJumpsRecursive(i, i, [i], [], moves, opponent);
          this.board[i] = player; // Restore

          // 1-step moves
          for (const target of Adjacency[i]) {
            if (this.board[target] === 0) {
              moves.push({
                from: i,
                to: target,
                path: [i, target],
                captures: []
              });
            }
          }
        }
        return moves;
      }

      findJumpsRecursive(origin, current, path, capturedList, results, opponent) {
        for (const jump of JumpTable[current]) {
          const mid = jump.over;
          const target = jump.to;

          if (this.board[mid] === opponent && !capturedList.includes(mid)) {
            // Vacant if empty on simulated board and not current node
            if (this.board[target] === 0 && target !== current) {
              capturedList.push(mid);
              path.push(target);

              // Every landing spot is an independent legal choice!
              results.push({
                from: origin,
                to: target,
                path: [...path],
                captures: [...capturedList]
              });

              // Mark captured mid as 0 in simulation
              const prevMid = this.board[mid];
              this.board[mid] = 0;

              // Recurse to discover arbitrary chains and loops
              this.findJumpsRecursive(origin, target, path, capturedList, results, opponent);

              // Backtrack
              this.board[mid] = prevMid;
              path.pop();
              capturedList.pop();
            }
          }
        }
      }

      // Query immediate single-jump options from an active node
      getAvailableJumpsFrom(nodeIndex, player, alreadyCaptured = []) {
        const opponent = player === 1 ? 2 : 1;
        const jumps = [];
        for (const jump of JumpTable[nodeIndex]) {
          const mid = jump.over;
          const target = jump.to;
          if (this.board[mid] === opponent && !alreadyCaptured.includes(mid)) {
            if (this.board[target] === 0 && target !== nodeIndex) {
              jumps.push({
                from: nodeIndex,
                to: target,
                over: mid,
                path: [nodeIndex, target],
                captures: [mid]
              });
            }
          }
        }
        return jumps;
      }

      applyMove(move) {
        this.board[move.to] = this.board[move.from];
        this.board[move.from] = 0;
        for (const cap of move.captures) {
          this.board[cap] = 0;
          if (this.currentTurn === 1) this.p2Count--;
          else this.p1Count--;
        }
        this.currentTurn = this.currentTurn === 1 ? 2 : 1;
      }

      applySingleJump(from, to, over, player) {
        this.board[to] = player;
        this.board[from] = 0;
        this.board[over] = 0;
        if (player === 1) this.p2Count--;
        else this.p1Count--;
      }

      endTurn() {
        this.currentTurn = this.currentTurn === 1 ? 2 : 1;
      }

      checkResult() {
        if (this.p1Count === 0) return 2;
        if (this.p2Count === 0) return 1;
        if (this.getLegalMoves(this.currentTurn).length === 0) return this.currentTurn === 1 ? 2 : 1;
        return 0;
      }
    }

    /* =========================================================================
       2. THREE.JS ISOMETRIC ENVIRONMENT & LIGHTING
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x091414);
    scene.fog = new THREE.FogExp2(0x091414, 0.022);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    function setupIsometricCamera() {
      camera.position.set(16, 20, 16);
      camera.lookAt(0, 0.6, 0);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    setupIsometricCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 9;
    controls.maxDistance = 34;
    controls.target.set(0, 0.6, 0);

    scene.add(new THREE.HemisphereLight(0xdcfce7, 0x064e3b, 1.25));
    const sun = new THREE.DirectionalLight(0xfffae5, 1.8);
    sun.position.set(18, 28, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    /* =========================================================================
       3. CANYON, RIVER, CLIFF WALLS, & PROCEDURAL FOLIAGE
       ========================================================================= */
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.85 });
    const mossMat = new THREE.MeshStandardMaterial({ color: 0x365314, roughness: 0.9 });
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.8 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x0891b2, roughness: 0.1, metalness: 0.8 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.95 });

    const canyonFloor = new THREE.Mesh(new THREE.BoxGeometry(24, 1, 24), mossMat);
    canyonFloor.position.y = -2.2;
    canyonFloor.receiveShadow = true;
    scene.add(canyonFloor);

    const river = new THREE.Mesh(new THREE.PlaneGeometry(8, 24), waterMat);
    river.rotation.x = -Math.PI / 2;
    river.rotation.z = Math.PI / 4;
    river.position.y = -2.15;
    river.receiveShadow = true;
    scene.add(river);

    const fortressWall = new THREE.Mesh(new THREE.BoxGeometry(16.8, 2.6, 16.8), wallMat);
    fortressWall.position.y = -1.3;
    fortressWall.receiveShadow = true;
    scene.add(fortressWall);

    const peakGroup = new THREE.Group();
    const mainPeak = new THREE.Mesh(new THREE.ConeGeometry(3.6, 8.0, 6), stoneMat);
    mainPeak.position.set(0, 3.2, -8.6);
    mainPeak.castShadow = true;
    const subPeak = new THREE.Mesh(new THREE.ConeGeometry(2.6, 5.8, 5), mossMat);
    subPeak.position.set(-3.2, 2.0, -8.0);
    subPeak.castShadow = true;
    peakGroup.add(mainPeak, subPeak);
    scene.add(peakGroup);

    const forest = new THREE.Group();
    function plantPine(x, y, z, scale) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * scale, 0.15 * scale, 1.2 * scale, 6), woodMat);
      trunk.position.set(x, y + 0.6 * scale, z);
      trunk.castShadow = true;
      const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.85 * scale, 2.2 * scale, 6), pineMat);
      foliage.position.set(x, y + 1.8 * scale, z);
      foliage.castShadow = true;
      forest.add(trunk, foliage);
    }

    for (let f = 0; f < 48; f++) {
      const angle = (f / 48) * Math.PI * 2;
      const dist = 7.0 + (f % 5) * 0.45;
      const tx = Math.cos(angle) * dist;
      const tz = Math.sin(angle) * dist;
      if (tz < -5.5 && Math.abs(tx) < 2) continue;
      plantPine(tx, -2.1, tz, 0.7 + (f % 4) * 0.2);
    }
    scene.add(forest);

    const nodePositions = [];
    const nodeMeshes = [];
    const pieceMeshes = new Map();
    const highlightRings = [];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const i = r * 5 + c;
        const pos = new THREE.Vector3((c - 2) * SPACING, ELEVATIONS[i], (r - 2) * SPACING);
        nodePositions.push(pos);

        const platform = new THREE.Group();
        const baseDais = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.05, 0.16, 8), stoneMat);
        const topDais = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.86, 0.12, 8), mossMat);
        topDais.position.y = 0.12;
        platform.add(baseDais, topDais);

        platform.position.copy(pos);
        baseDais.receiveShadow = true;
        topDais.receiveShadow = true;
        baseDais.userData = { nodeIndex: i };
        topDais.userData = { nodeIndex: i };
        platform.userData = { nodeIndex: i };

        scene.add(platform);
        nodeMeshes.push(topDais);

        const pillarDepth = pos.y + 2.2;
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.68, pillarDepth, 8), stoneMat);
        pillar.position.set(pos.x, pos.y - pillarDepth / 2, pos.z);
        pillar.receiveShadow = true;
        scene.add(pillar);
      }
    }

    const drawnBridges = new Set();
    for (let i = 0; i < NODE_COUNT; i++) {
      for (const adj of Adjacency[i]) {
        const min = Math.min(i, adj), max = Math.max(i, adj);
        if (!drawnBridges.has(`${min}-${max}`)) {
          drawnBridges.add(`${min}-${max}`);
          const pA = nodePositions[min], pB = nodePositions[max];
          const dist = pA.distanceTo(pB);

          const bridgeGroup = new THREE.Group();
          const deck = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, dist), stoneMat);
          const arch = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.28, dist * 0.72), wallMat);
          arch.position.y = -0.16;

          bridgeGroup.add(deck, arch);
          bridgeGroup.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
          bridgeGroup.position.y -= 0.06;
          bridgeGroup.lookAt(pB);
          deck.receiveShadow = true;
          scene.add(bridgeGroup);
        }
      }
    }

    /* =========================================================================
       4. SCULPTED ASYMMETRIC FANTASY PIECES
       ========================================================================= */
    const jadeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2, metalness: 0.1 });
    const sandstoneMat = new THREE.MeshStandardMaterial({ color: 0xd6d3d1, roughness: 0.65 });
    const obsidianMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.15, metalness: 0.85 });
    const basaltMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.75, metalness: 0.2 });
    const bronzeAccent = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.35, metalness: 0.8 });

    function createSculptedUnit(owner, nodeIndex) {
      const group = new THREE.Group();
      const isLight = (owner === 1);
      const primaryMat = isLight ? sandstoneMat : basaltMat;
      const specialMat = isLight ? jadeMat : obsidianMat;
      const c = nodeIndex % 5;

      // Apex Creature: Jade Phoenix (2) / Obsidian Dragon (22)
      if ((isLight && nodeIndex === 2) || (!isLight && nodeIndex === 22)) {
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.85, 5), specialMat);
        body.position.y = 0.45;
        const wings = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.22, 0.18), bronzeAccent);
        wings.position.y = 0.55;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), specialMat);
        head.position.set(0, 0.9, 0.1);
        group.add(body, wings, head);
      }
      // Stepped Ziggurat Pyramids (1, 3, 21, 23)
      else if (nodeIndex === 1 || nodeIndex === 3 || nodeIndex === 21 || nodeIndex === 23) {
        for (let t = 0; t < 4; t++) {
          const size = 0.72 - (t * 0.15);
          const tier = new THREE.Mesh(new THREE.BoxGeometry(size, 0.16, size), primaryMat);
          tier.position.y = 0.08 + (t * 0.16);
          group.add(tier);
        }
      }
      // Winged Totem Poles (0 & 4)
      else if (c === 0 || c === 4) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 1.1, 8), primaryMat);
        pole.position.y = 0.55;
        const crossWing = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.14, 0.12), specialMat);
        crossWing.position.y = 0.85;
        group.add(pole, crossWing);
      }
      // Styne Golems (Heavy Stone Titans)
      else {
        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.28, 0.35), primaryMat);
        legs.position.y = 0.14;
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.48, 0.42), primaryMat);
        torso.position.y = 0.48;
        const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.18, 0.35), specialMat);
        shoulders.position.y = 0.62;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.24, 0.26), bronzeAccent);
        head.position.y = 0.82;
        group.add(legs, torso, shoulders, head);
      }

      group.children.forEach(child => {
        child.castShadow = true;
        child.receiveShadow = true;
        child.userData = { nodeIndex };
      });
      group.userData = { nodeIndex };
      return group;
    }

    /* =========================================================================
       5. GAME FLOW & INTERACTION LOGIC (GUIDED / UNGUIDED & CHAIN STATE)
       ========================================================================= */
    const game = new Engine();
    let selectedNode = null;
    let availableMoves = [];
    let isAnimating = false;
    let vsComputer = true;
    let isGuided = true; // Guided Mode vs Unguided Mode

    // Interactive multi-jump chain tracker
    let activeChain = null; // { currentNode, captured: [], jumps: [] }

    function spawnAllPieces() {
      pieceMeshes.forEach(mesh => scene.remove(mesh));
      pieceMeshes.clear();

      for (let i = 0; i < NODE_COUNT; i++) {
        const owner = game.board[i];
        if (owner !== 0) {
          const piece = createSculptedUnit(owner, i);
          piece.position.copy(nodePositions[i]);
          piece.position.y += 0.16;
          scene.add(piece);
          pieceMeshes.set(i, piece);
        }
      }
      updateHUD();
    }

    function clearHighlights() {
      highlightRings.forEach(ring => scene.remove(ring));
      highlightRings.length = 0;
    }

    function showMoveDestinations(moves) {
      clearHighlights();
      if (!isGuided) return; // UNGUIDED MODE: Zero highlight rings!

      for (const m of moves) {
        const isJump = m.captures.length > 0;
        const ringColor = isJump ? 0xf59e0b : 0x38bdf8; // Amber for jump, Cyan for step

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.55, 0.78, 24),
          new THREE.MeshBasicMaterial({ color: ringColor, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(nodePositions[m.to]);
        ring.position.y += 0.22;
        scene.add(ring);
        highlightRings.push(ring);
      }
    }

    function animateMovement(move, onDone) {
      isAnimating = true;
      const piece = pieceMeshes.get(move.from);
      pieceMeshes.delete(move.from);

      const waypoints = move.path.map(idx => {
        const p = nodePositions[idx].clone();
        p.y += 0.16;
        return p;
      });

      let stepIndex = 0;
      function step() {
        if (stepIndex >= waypoints.length - 1) {
          piece.userData.nodeIndex = move.to;
          piece.children.forEach(c => c.userData.nodeIndex = move.to);
          pieceMeshes.set(move.to, piece);

          for (const cap of move.captures) {
            const victim = pieceMeshes.get(cap);
            if (victim) {
              scene.remove(victim);
              pieceMeshes.delete(cap);
            }
          }
          isAnimating = false;
          onDone();
          return;
        }

        const start = waypoints[stepIndex], end = waypoints[stepIndex + 1];
        const isJump = move.captures.length > 0;
        const peak = isJump ? 1.2 : 0.45;
        let progress = 0;

        function tween() {
          progress += 0.065;
          const t = Math.min(progress, 1);
          const current = new THREE.Vector3().lerpVectors(start, end, t);
          current.y += Math.sin(t * Math.PI) * peak;
          piece.position.copy(current);

          if (t < 1) requestAnimationFrame(tween);
          else { stepIndex++; step(); }
        }
        tween();
      }
      step();
    }

    const btnFinishTurn = document.getElementById('btn-finish-turn');

    function finishActiveChain() {
      if (!activeChain) return;
      activeChain = null;
      btnFinishTurn.style.display = 'none';
      clearHighlights();
      selectedNode = null;
      game.endTurn();
      updateHUD();

      const res = game.checkResult();
      if (res !== 0) showGameOver(res);
      else if (vsComputer && game.currentTurn === 2) triggerAIMove();
    }

    btnFinishTurn.onclick = finishActiveChain;

    /* --- TOUCH RAYCASTER (HANDLES STEP-BY-STEP MULTI-JUMPS & UNGUIDED SELECTION) --- */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#ui-layer') || e.target.closest('#game-over-modal')) return;
      if (Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY) > 22) return;
      if (isAnimating) return;
      if (vsComputer && game.currentTurn === 2) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const clickable = [...nodeMeshes];
      pieceMeshes.forEach(mesh => mesh.children.forEach(child => clickable.push(child)));

      const intersects = raycaster.intersectObjects(clickable);
      if (intersects.length === 0) return;

      const clickedIndex = intersects[0].object.userData.nodeIndex;
      if (clickedIndex === undefined) return;

      // 1. IN THE MIDDLE OF A MULTI-JUMP CHAIN?
      if (activeChain !== null) {
        // Tapping the active piece stops the chain early
        if (clickedIndex === activeChain.currentNode) {
          finishActiveChain();
          return;
        }

        // Check if clicked node is a legal next jump
        const nextJump = activeChain.jumps.find(j => j.to === clickedIndex);
        if (nextJump) {
          clearHighlights();
          animateMovement(nextJump, () => {
            game.applySingleJump(nextJump.from, nextJump.to, nextJump.over, game.currentTurn);
            activeChain.captured.push(nextJump.over);
            activeChain.currentNode = nextJump.to;

            // Check if further jumps exist from this new landing spot
            const furtherJumps = game.getAvailableJumpsFrom(nextJump.to, game.currentTurn, activeChain.captured);

            if (furtherJumps.length > 0) {
              activeChain.jumps = furtherJumps;
              btnFinishTurn.style.display = 'block';
              showMoveDestinations(furtherJumps);
            } else {
              // No further jumps available - turn automatically completes
              finishActiveChain();
            }
          });
        }
        return;
      }

      const owner = game.board[clickedIndex];

      // 2. SELECT OWN PIECE (NEW MOVE)
      if (owner === game.currentTurn) {
        selectedNode = clickedIndex;

        // In Guided mode, compute legal immediate moves (steps and first-leg jumps)
        const steps = [];
        for (const target of Adjacency[clickedIndex]) {
          if (game.board[target] === 0) {
            steps.push({ from: clickedIndex, to: target, path: [clickedIndex, target], captures: [] });
          }
        }
        const initialJumps = game.getAvailableJumpsFrom(clickedIndex, game.currentTurn, []);
        availableMoves = initialJumps.concat(steps);

        showMoveDestinations(availableMoves);
        if (navigator.vibrate) navigator.vibrate(15);
        return;
      }

      // 3. EXECUTE MOVE TO TARGET PLATFORM
      if (selectedNode !== null) {
        // Check legal moves from selected piece
        const steps = [];
        for (const target of Adjacency[selectedNode]) {
          if (game.board[target] === 0) {
            steps.push({ from: selectedNode, to: target, path: [selectedNode, target], captures: [] });
          }
        }
        const initialJumps = game.getAvailableJumpsFrom(selectedNode, game.currentTurn, []);
        const allPossible = initialJumps.concat(steps);

        const chosen = allPossible.find(m => m.to === clickedIndex);
        if (chosen) {
          clearHighlights();

          // Case A: Simple 1-Step Move
          if (chosen.captures.length === 0) {
            selectedNode = null;
            if (navigator.vibrate) navigator.vibrate(20);

            animateMovement(chosen, () => {
              game.applyMove(chosen);
              updateHUD();
              const res = game.checkResult();
              if (res !== 0) showGameOver(res);
              else if (vsComputer && game.currentTurn === 2) triggerAIMove();
            });
          }
          // Case B: Jump Capture (Start chain)
          else {
            if (navigator.vibrate) navigator.vibrate([25, 40, 25]);
            animateMovement(chosen, () => {
              game.applySingleJump(chosen.from, chosen.to, chosen.over, game.currentTurn);
              const captured = [chosen.over];

              // Check if further jumps exist
              const nextJumps = game.getAvailableJumpsFrom(chosen.to, game.currentTurn, captured);

              if (nextJumps.length > 0) {
                // Enter active jump chain state
                activeChain = {
                  currentNode: chosen.to,
                  captured: captured,
                  jumps: nextJumps
                };
                selectedNode = chosen.to;
                btnFinishTurn.style.display = 'block';
                showMoveDestinations(nextJumps);
              } else {
                // Single jump completed with no further options
                selectedNode = null;
                game.endTurn();
                updateHUD();
                const res = game.checkResult();
                if (res !== 0) showGameOver(res);
                else if (vsComputer && game.currentTurn === 2) triggerAIMove();
              }
            });
          }
        }
      }
    });

    function triggerAIMove() {
      setTimeout(() => {
        const moves = game.getLegalMoves(2);
        if (moves.length === 0) {
          showGameOver(1);
          return;
        }

        // AI selects best chain (prefers multi-jumps of any length/loop)
        moves.sort((a, b) => {
          if (b.captures.length !== a.captures.length) return b.captures.length - a.captures.length;
          return Math.random() - 0.5;
        });

        const best = moves[0];
        animateMovement(best, () => {
          game.applyMove(best);
          updateHUD();
          const res = game.checkResult();
          if (res !== 0) showGameOver(res);
        });
      }, 400);
    }

    /* =========================================================================
       6. UI HUD, MODE TOGGLES, & RENDER LOOP
       ========================================================================= */
    const turnDot = document.getElementById('turn-dot');
    const turnText = document.getElementById('turn-text');
    const p1Score = document.getElementById('p1-score');
    const p2Score = document.getElementById('p2-score');
    const modal = document.getElementById('game-over-modal');
    const legendBar = document.getElementById('legend-bar');

    function updateHUD() {
      p1Score.textContent = game.p1Count;
      p2Score.textContent = game.p2Count;

      if (game.currentTurn === 1) {
        turnDot.style.background = '#4ade80';
        turnDot.style.color = '#4ade80';
        turnText.textContent = 'LIGHT TURN';
      } else {
        turnDot.style.background = '#94a3b8';
        turnDot.style.color = '#94a3b8';
        turnText.textContent = vsComputer ? 'COMPUTER...' : 'DARK TURN';
      }
    }

    function showGameOver(winner) {
      modal.style.display = 'flex';
      document.getElementById('modal-title').textContent = winner === 1 ? 'Light Triumph!' : 'Dark Triumph!';
      document.getElementById('modal-desc').textContent = 'Opposing forces eliminated or locked.';
    }

    document.getElementById('btn-restart').onclick = () => {
      activeChain = null;
      btnFinishTurn.style.display = 'none';
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    document.getElementById('modal-btn-restart').onclick = () => {
      activeChain = null;
      btnFinishTurn.style.display = 'none';
      modal.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    const btnMode = document.getElementById('btn-mode');
    btnMode.onclick = () => {
      vsComputer = !vsComputer;
      btnMode.textContent = vsComputer ? 'Mode: vs Computer' : 'Mode: 2 Players';
      activeChain = null;
      btnFinishTurn.style.display = 'none';
      game.reset();
      spawnAllPieces();
    };

    const btnGuide = document.getElementById('btn-guide');
    btnGuide.onclick = () => {
      isGuided = !isGuided;
      btnGuide.textContent = isGuided ? 'Guide: ON' : 'Guide: OFF';
      legendBar.style.display = isGuided ? 'flex' : 'none';
      clearHighlights();
      if (selectedNode !== null && isGuided) {
        showMoveDestinations(availableMoves);
      }
    };

    window.addEventListener('resize', () => {
      setupIsometricCamera();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    spawnAllPieces();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
